<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E1624"/>
      <stop offset="50%" stop-color="#460D17"/>
      <stop offset="100%" stop-color="#24050B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8"/>
      <stop offset="25%" stop-color="#F2CE63"/>
      <stop offset="60%" stop-color="#CFA035"/>
      <stop offset="100%" stop-color="#936814"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D779" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#B88A28" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#734D09" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background tile with liturgical leather squircle -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Inset golden accent border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="12" fill="none" stroke="url(#goldRim)" stroke-width="1.2"/>

  <!-- Anglican / Liturgical Cross with Nimbus Glory Ring -->
  <g filter="url(#subtleGlow)">
    <!-- Nimbus glory ring -->
    <circle cx="32" cy="27" r="10.5" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" opacity="0.88"/>

    <!-- Cross Body with flared terminals (Canterbury / BCP style) -->
    <!-- Path defining the flared Latin cross -->
    <path d="
      M 30,14
      C 30,12 28.5,10 27,9
      L 37,9
      C 35.5,10 34,12 34,14
      L 34,24
      L 44,24
      C 46,24 48,22.5 49,21
      L 49,33
      C 48,31.5 46,30 44,30
      L 34,30
      L 34,45
      C 34,47.5 35.5,49.5 37,51
      L 27,51
      C 28.5,49.5 30,47.5 30,45
      L 30,30
      L 20,30
      C 18,30 16,31.5 15,33
      L 15,21
      C 16,22.5 18,24 20,24
      L 30,24
      Z"
      fill="url(#goldGrad)"
    />

    <!-- Center diamond highlight -->
    <polygon points="32,23 35,27 32,31 29,27" fill="#FFF8CC" opacity="0.95"/>
  </g>
</svg>
